name: 全球户外客户自动采集

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京时间 凌晨2:00
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 安装Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    - name: 安装依赖
      run: pip install selenium beautifulsoup4 openpyxl lxml requests webdriver-manager
    - name: 运行采集
      env:
        PUSH_EMAIL: ${{ secrets.PUSH_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        PUSH_WX_KEY: ${{ secrets.PUSH_WX_KEY }}
      run: python all_in_one.py
    - name: 上传结果
      uses: actions/upload-artifact@v4
      with:
        name: 客户数据-${{ github.run_id }}
        path: 客户数据/
        retention-days: 90
